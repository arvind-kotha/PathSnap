[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap-laptop1"
version = "0.1.0"
description = "PathSnap map-matching model, training workflow, and Laptop 1 API"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "joblib>=1.3",
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "optuna>=3.6", "folium>=0.15", "xgboost>=2.0"
]

[project.scripts]
pathsnap-train = "pathsnap.train:main"
pathsnap-map = "pathsnap.map:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
